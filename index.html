<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>JS Todo List Tutorial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Список задач</h1>
    
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Что нужно сделать?" required>
      <button type="submit" id="add-btn">Добавить</button>
    </form>

    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
