<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="img/todo-list.png" type="image/png" />
    <title>JS Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="main-title">Список задач</h1>

    <div class="container">
      <form id="todo-form">
        <input
          type="text"
          name="description"
          id="todo-input"
          placeholder="Что нужно сделать?"
          required
        />
      </form>

      <div id="todo-container"></div>
      <div class="controls">
        <span id="items-left">Осталось задач: 0</span>
        <div class="filters">
          <button id="filter-all" class="active">Все</button>
          <button id="filter-active">Активные</button>
          <button id="filter-completed">Завершенные</button>
        </div>
      </div>
    </div>

    <script src="logic.js"></script>
    <script src="dom.js"></script>
  </body>
</html>
